[build-dependencies.qt_ritual_build]
path = "../../../qt_ritual_build"
version = "0.5.0"

[dependencies.cpp_core]
path = "../../../cpp_core"
version = "0.6.0"

[dependencies.qt_3d_core]
path = "../qt_3d_core"
version = "0.0.0"

[dependencies.qt_core]
path = "../qt_core"
version = "0.0.0"

[dependencies.qt_gui]
path = "../qt_gui"
version = "0.0.0"

[features]
ritual_rustdoc = ["qt_core/ritual_rustdoc", "qt_gui/ritual_rustdoc", "qt_3d_core/ritual_rustdoc"]
ritual_rustdoc_nightly = ["qt_core/ritual_rustdoc_nightly", "qt_gui/ritual_rustdoc_nightly", "qt_3d_core/ritual_rustdoc_nightly"]

[package]
authors = ["Pavel Strakhov <ri@idzaaus.org>"]
build = "build.rs"
categories = ["external-ffi-bindings", "gui"]
description = "Bindings for Qt3DLogic C++ library"
documentation = "https://docs.rs/qt_3d_logic"
edition = "2018"
keywords = ["gui", "ffi", "qt", "ritual"]
license = "MIT OR Apache-2.0"
name = "qt_3d_logic"
repository = "https://github.com/rust-qt/ritual"
version = "0.0.0"

[package.metadata.docs.rs]
features = ["ritual_rustdoc", "ritual_rustdoc_nightly"]
