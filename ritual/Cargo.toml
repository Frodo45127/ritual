[package]
name = "ritual"
edition = "2018"
version = "0.0.0"
authors = ["Pavel Strakhov <ri@idzaaus.org>"]
description = "Automatic generator of C++ library wrappers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-qt/ritual"
exclude = ["test_assets/**/*"]

[dependencies]

ritual_common = { version = "0.4.0", path = "../ritual_common" }

regex = "1"
serde = { version = "1", features = ["rc", "derive"] }
serde_derive = "1"
clang = { path = "../clang-patched", features = ["clang_10_0"] }    # C++ parsing (patched for clang 22)
tempfile = "3.20"   # temporary directory creation
itertools = "0.14"
log = "0.4"
rayon = "1"
num_cpus = "1"
flexi_logger = "0.31"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
amqp = "0.1.3"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
reqwest = { version = "0.13", features = ["blocking"] }
flate2 = "1"
tar = "0.4"
semver = "1"
